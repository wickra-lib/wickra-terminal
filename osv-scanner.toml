# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry is an advisory assessed as
# not affecting wickra-terminal; this mirrors the cargo-deny `ignore` list in
# deny.toml at the OSV layer.
#
# Keep in lock-step with deny.toml's [advisories].ignore.

# RUSTSEC-2024-0436 (paste, unmaintained) was listed here for ratatui; ratatui
# 0.30 dropped the dependency, so the record no longer describes anything in the
# graph and the entry was removed.

# rkyv is in Cargo.lock and is not compiled. It is reachable only through an
# optional `rust_decimal` feature this workspace does not enable, so it appears
# in the lockfile without entering the build:
#
#   cargo tree --workspace --all-features -e normal,build,dev --target all
#     | grep -c rkyv   ->   0
#
# rust_decimal is already at its latest release (1.42.1), so there is no upgrade
# that drops the entry, and the vulnerable code is never built into anything this
# repository ships.
#
# Deliberately NOT mirrored into deny.toml, which the header above otherwise asks
# for. cargo-deny resolves the feature graph and so never reports this one; an
# ignore entry there would match nothing, and deny.toml's own rule is that a
# suppression matching nothing only hides the next real finding. OSV-Scanner and
# Scorecard read the lockfile instead, which is why the record is needed here and
# only here.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0235"
reason = "rkyv is a lockfile-only entry behind an optional rust_decimal feature this workspace does not enable; it is never compiled."


# pytest tmpdir handling (CVSS 6.8, fixed in pytest 9.0.3) -- pytest through
# 9.0.2 on UNIX uses predictable /tmp/pytest-of-{user} directories, which a
# *second local user on the same machine* can abuse for denial of service or
# possibly privilege escalation. Two reasons that does not apply here. pytest is
# a test dependency: it is in .github/requirements/, never in a published wheel,
# so no user of the terminal ever runs it. And it runs only on GitHub-hosted
# runners, each a fresh single-user VM with no second local user to exploit it.
#
# It cannot simply be upgraded either: pytest 9 requires Python >= 3.10, while
# ci-dev-py39.txt exists to test the Python 3.9 row of the matrix -- 3.9 being
# the abi3 floor the wheel is built against. ci-dev-py3.txt already carries
# 9.1.1; only the 3.9 row is pinned back. Removing the exposure means dropping
# Python 3.9, which is a decision about who can install the terminal rather than
# about this advisory. It resolves itself when 3.9 goes.
#
# Recorded here rather than left implicit in the requirements comment: this file
# is now actually read -- ci.yml runs osv-scanner against it -- so an assessment
# written down here is one the scan consults, instead of prose nothing consumes.
[[IgnoredVulns]]
id = "GHSA-6w46-j5rx-g56g"
reason = "pytest is a CI-only test dependency, never shipped; the flaw needs a second local user, which a single-user ephemeral runner does not have. Pinned at 8.4.2 in the 3.9 row because pytest 9 requires Python >= 3.10."
