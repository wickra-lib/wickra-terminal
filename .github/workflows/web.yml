name: Web renderer

# Build the browser renderer (WASM + Vue) and publish it to the `pages` branch,
# which Cloudflare Pages serves as the project `wickra-terminal` at
# https://terminal-web.wickra.org.
#
# Cloudflare's build image has no Rust, and the renderer needs the WASM binding
# built first, so the build runs here. The built web/dist becomes the whole tree
# of `pages` in one signed commit (signed-commit, mode tree; an unchanged build
# makes no commit). The Pages project is connected to this repository through
# Cloudflare's Git integration with `pages` as its production branch, no build
# command, `/` as the output directory and no preview branches, so no Cloudflare
# token or secret is involved.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "bindings/wasm/**"
      - "crates/wickra-terminal-core/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, the newest last; a deploy in flight is never cut off.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build + deploy the web renderer
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # the signed commit to the pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/warm-cargo

      - name: Install wasm-pack
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: wasm-pack

      - name: Build the WASM package
        run: wasm-pack build bindings/wasm --target web --release

      - name: Install web dependencies
        # npm's own fetch-retry rides out a single bad request; wrapping the whole
        # install means a longer registry outage retries instead of failing the job.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd web && npm ci --no-audit --no-fund
          shell: bash
      - name: Build the web renderer
        working-directory: web
        run: npm run build

      - name: Publish web/dist to the pages branch
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mode: tree
          source: web/dist
          branch: pages
          message: Deploy the web renderer built from ${{ github.sha }}
