name: Testnet integration

# The gated integration test opens a live connection to a public exchange
# endpoint (public market data, no keys), so it is not part of the per-push
# ci.yml. It runs on a schedule and on demand instead, surfacing upstream/API
# drift without flaking every PR.
on:
  schedule:
    - cron: "0 4 * * *" # nightly at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

concurrency:
  group: testnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Live integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      # The Live source's #[ignore] test opens real HTTP + WebSocket connections
      # to three public venues (Binance, OKX, Kraken) and waits for each to
      # stream; run it here, not on every push.
      - name: Run gated live-integration tests
        # Binance geo-restricts data-centre IP ranges, so a hosted runner cannot
        # reach it; OKX and Kraken answer the same runners and carry the check.
        # Opt this job into skipping a venue it cannot reach, reported as a job
        # notice; a developer running the same test locally gets a hard failure
        # instead, which is the point of the gate. A venue that answers and
        # streams nothing fails either way, and a runner that reaches no venue at
        # all still prints a job warning.
        env:
          WICKRA_LIVE_ALLOW_SKIP: "1"
        run: cargo test -p wickra-terminal-core --all-features -- --ignored --nocapture
