name: Testnet integration

# The gated integration test opens a live connection to a public exchange
# endpoint (public market data, no keys), so it is not part of the per-push
# ci.yml. It runs on a schedule and on demand instead, surfacing upstream/API
# drift without flaking every PR.
on:
  schedule:
    - cron: "0 4 * * *" # nightly at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

concurrency:
  group: testnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Live integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # The Live source's #[ignore] test opens a real HTTP + WebSocket connection
      # to a public venue and folds a few streamed events; run it here, not on
      # every push.
      - name: Run gated live-integration tests
        run: cargo test -p terminal-core --all-features -- --ignored --nocapture
