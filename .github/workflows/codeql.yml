name: CodeQL

# Static analysis security testing. Results appear under Security → Code
# scanning.
#
# The matrix covers every language in the repository, not only the three that
# read as source without a build. Rust, Python and JavaScript/TypeScript are
# analysed directly; Go, C/C++, C# and Java are compiled first, and they are the
# ones where a memory or lifetime mistake is possible at all:
#
#   - bindings/go casts slice base addresses through unsafe.Pointer and hands
#     them to C, and frees the handle from a finalizer.
#   - bindings/c/src owns the raw pointers, and include/wickra_terminal.hpp is a
#     hand-written RAII wrapper over them that the C examples compile and run.
#   - bindings/csharp and bindings/java hold a native handle across a managed
#     boundary and free it on Dispose/close.
#
# `build-mode: none` was not an option for those four: without a build no
# dependency resolves, GitHub reports the analysis as low quality (it wants 85%
# of calls to resolve to a target), and the extractor produces a database that
# says little. `manual` rather than `autobuild` for C#, C/C++ and Java because
# this repository has several projects per language and guessing which to build
# is how a scan ends up quietly covering the wrong one. Go is the exception:
# with a manual command CodeQL traced the build and finalised an empty database,
# so its own extractor runs the build, and the C ABI library is staged in front
# of it because cgo has to link.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 0' # Sundays 03:31 UTC

# Least-privilege default for the auto-injected GITHUB_TOKEN. The analyze job
# raises exactly the scopes CodeQL needs (security-events: write to upload
# results) in its own job-level block below; this top-level read-only default
# covers any future job (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30  # backstop against a hung job, not a budget
    permissions:
      security-events: write # upload CodeQL results to code-scanning
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: manual
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the Java build needs this, and it needs a newer JDK than the runner
      # default: the binding targets java.lang.foreign and the pom sets
      # release 22.
      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      # Go, C/C++, C# and Java all need the C ABI library present before they
      # build: Go links it through cgo, the C examples link it via CMake, and the
      # managed bindings load it at test time. One cargo build serves all four.
      - name: Install Rust toolchain
        if: contains(fromJSON('["go","c-cpp","csharp","java-kotlin"]'), matrix.language)
        uses: ./.github/actions/setup-rust

      - name: Build the C ABI library
        if: contains(fromJSON('["go","c-cpp","csharp","java-kotlin"]'), matrix.language)
        run: cargo build -p wickra-terminal-c --release

      # Staged before CodeQL autobuilds: the cgo LDFLAGS point at
      # ${SRCDIR}/lib/<goos>_<goarch>, so without the library there the build
      # cannot link and nothing is extracted.
      - name: Stage the native library for cgo
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_terminal.so bindings/go/lib/linux_amd64/

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # The C examples consume the header and the hand-written C++ RAII wrapper,
      # so compiling them is what puts both in the database. bindings/r/src is
      # NOT covered here: it is built by the R toolchain during package build,
      # and pulling that in would add a fragile dependency for one file. Said
      # plainly rather than left to look like coverage.
      - name: Build the C and C++ examples
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release

      # CodeQL sees exactly what the compiler walks, so anything not built is not
      # analysed. The example is built alongside the binding and the benchmark:
      # it is the code people copy into their own projects.
      - name: Build the C# binding, example and benchmarks
        if: matrix.language == 'csharp'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build bindings/csharp/WickraTerminal.Tests/WickraTerminal.Tests.csproj -c Release
          dotnet build bindings/csharp/benchmarks/Benchmarks.csproj -c Release
          dotnet build examples/csharp/SynthTerminal.csproj -c Release

      # test-compile rather than test: CodeQL needs the code compiled, not
      # exercised, and the hand-written tests are where a handle-lifetime mistake
      # would show. examples/java is a bare source file with no project of its
      # own, so it is compiled against the binding's sources the same way
      # examples-smoke does it.
      - name: Build the Java binding and example
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f bindings/java test-compile
          mkdir -p /tmp/java-examples
          javac --release 22 -d /tmp/java-examples \
            -sourcepath bindings/java/src/main/java examples/java/*.java

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
