name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm / PyPI inside any build step (cargo,
  # napi, maturin, wasm-pack, npm ci, pip) retries automatically instead of
  # failing the job and needing a manual re-run. Cargo treats "couldn't resolve
  # host" / connect / timeout as spurious and retries with backoff; 10 attempts
  # ride out a transient DNS blip on a runner. Complements the setup-action /
  # cache retries (which only cover toolchain download + cache restore).
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    # The ui-tui binary and the C ABI cdylib are both named wickra_terminal on
    # Windows, so building both in one --workspace pass makes two units write the
    # same wickra_terminal.pdb concurrently and intermittently trips LNK1201. The
    # fix is to not build both together: wickra-terminal-c is compiled and tested
    # by the dedicated `c-abi` job, so exclude it here — that removes the
    # collision entirely. Debug info is also dropped (tests do not need it, and it
    # keeps runner disk use down); RUSTFLAGS is part of the cache key.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin; the C ABI cdylib by the `c-abi` job. Exclude both here — the
      # latter also avoids the wickra_terminal.pdb output-filename collision.
      - run: cargo build --workspace --all-features --exclude wickra-terminal-python --exclude wickra-terminal-c
      - run: cargo test --workspace --all-features --exclude wickra-terminal-python --exclude wickra-terminal-c

  lint:
    name: Format & Clippy (${{ matrix.os }})
    # Linted on every OS the crate is built for, not just Linux. A lint can be
    # platform-conditional, and this repository has platform-conditional code:
    # the wickra_terminal.pdb workaround in `test` and the cygpath branch in the
    # `r` job both exist because Windows behaves differently. Clippy does not
    # link, so the pdb collision `test` works around cannot occur here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      # The Node binding (napi 3) and the ui-tui app (ratatui pulls instability,
      # which needs 1.88) require Rust 1.88 and are checked separately below; the
      # Python binding needs maturin's platform link flags and is built by the
      # `python` job. The library (wickra-terminal-core) and the C ABI stay 1.86.
      - run: >
          cargo build --workspace
          --exclude wickra-terminal-python
          --exclude wickra-terminal-node
          --exclude wickra-terminal

  msrv-1_88:
    name: MSRV node + tui (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - run: cargo build -p wickra-terminal-node -p wickra-terminal

  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # static checks; if they are not done in ten minutes they are stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ten language reaches sit on one C ABI, and each is tested separately. The
      # golden corpus compares values, so a binding that never grew a method has
      # no test to fail. This holds every language to the header instead.
      - name: Compare every binding's surface with the C ABI
        run: python3 scripts/check_binding_surface.py

      # The version lives in twenty-odd declarations across six package
      # managers. A bump that misses one publishes, say, an npm package pinning
      # a native binary that was never built -- which surfaces at install time,
      # on a user's machine, after the tag is already irreversible.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # Each bindings/*/README.md is the long description of a published
      # package: PyPI, NuGet, pkg.go.dev and r-universe render them. A link that
      # leaves the package resolves on GitHub and nowhere else, and nothing else
      # in the build would say so, because the file it points at does exist.
      - name: Binding READMEs link only to what travels with them
        run: python3 scripts/check_readme_links.py

  supply-chain:
    name: Supply-chain (cargo-deny + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-deny
      - run: cargo deny check

      # osv-scanner.toml existed and nothing ran it. The file records advisories
      # assessed as not affecting this project, with the reasoning next to each
      # -- and that assessment was load-bearing for nobody, because no workflow
      # ever consulted it.
      #
      # cargo-deny above covers the Rust graph only. This covers the other six
      # ecosystems -- npm, PyPI, Maven, NuGet, Go modules, R -- which had no
      # vulnerability scanning in CI at all.
      #
      # --no-resolve turns off transitive resolution of *manifests*. The default
      # enricher resolves each pom.xml against Maven Central, and ours depends on
      # org.wickra:wickra-terminal at the version in the tree -- which does not
      # exist there until the release publishes it. Without the flag every
      # version bump makes this job fail on a lookup for the artefact the bump
      # exists to create. A check that goes red for a reason other than the one
      # it checks teaches people to ignore it.
      #
      # Everything pinned in a lockfile -- Cargo.lock, package-lock.json, go.mod
      # -- is still scanned in full and transitively, because a lockfile needs no
      # resolution.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            ./

  # The published API is a promise, and the two crates that carry it --
  # wickra-terminal-core and wickra-terminal -- are what ten language bindings
  # sit on top of. Nothing checked that a patch release leaves the surface
  # alone.
  #
  # The baseline is the newest version already on crates.io, fetched by the tool
  # itself. Neither crate is published yet (see ROADMAP: the release is blocked
  # on wickra-exchange reaching crates.io), and cargo-semver-checks fails rather
  # than passes when it cannot find a baseline -- so the probe below decides
  # which of the two situations we are in and says so out loud. It is a no-op
  # today and becomes a real gate the moment 0.1.0 publishes, without anyone
  # having to remember to come back and enable it.
  semver:
    name: Public API (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: it builds rustdoc JSON for each crate and its baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      # The sparse index answers 404 for a crate that has never been published,
      # which is the only way to tell "no baseline yet" from "the registry is
      # unreachable" -- and those two must not be treated alike.
      - name: Is there a baseline on crates.io yet?
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          published=yes
          for crate in wickra-terminal-core wickra-terminal; do
            url="https://index.crates.io/wi/ck/${crate}"
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "$url")
            case "$code" in
              200) ;;
              404) published=no ;;
              *) echo "::error::crates.io index returned $code for $crate"; exit 1 ;;
            esac
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Not published yet, so there is nothing to compare against
        if: steps.baseline.outputs.published == 'no'
        run: |
          echo "::notice::wickra-terminal-core and wickra-terminal are not on crates.io, so cargo-semver-checks has no baseline. This job becomes a real gate with the first release."

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.published == 'yes'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-semver-checks

      # Named explicitly rather than --workspace: the bench crate and the four
      # binding crates are `publish = false`, so they have no baseline to compare
      # against and nothing to promise.
      - name: Check the published crates
        if: steps.baseline.outputs.published == 'yes'
        run: |
          cargo semver-checks check-release -p wickra-terminal-core -p wickra-terminal

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is listed in the classifiers but not tested here, and that is
        # deliberate: maturin builds one abi3 wheel against the 3.9 stable ABI
        # (cp39-abi3), so every later minor loads the same binary by the ABI
        # guarantee. Testing the floor plus the three current minors covers the
        # pure-Python layer; a fifth job would re-prove the ABI contract.
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      # Hash-pinned, and installed with --require-hashes so pip refuses
      # anything whose artefact does not match. Split by version because no
      # single pytest covers the matrix: PYSEC-2026-1845 is fixed in 9.0.3 and
      # pytest 9 needs Python >= 3.10, while 3.9 is the abi3 floor. The reason
      # is written out in the .in files beside the locks.
      - name: Install the pinned build and test tooling
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      # --no-index keeps pip off PyPI so the freshly built wheel is the one
      # under test, --force-reinstall makes it win over anything already
      # installed, and --no-deps stops pip reaching the network to resolve
      # dependencies the package does not have (dependencies = [] in
      # pyproject.toml). Without the last two, pip may still contact an index,
      # which is what Scorecard reads as an unpinned dependency.
      - run: pip install --no-index --find-links bindings/python/dist --force-reinstall --no-deps wickra-terminal
      - run: pytest bindings/python/tests -q

  # The Linux wheels are built in manylinux/musllinux containers at release time
  # and were never installed anywhere before being pushed to PyPI, which is
  # irreversible. The Python job above runs on the bare ubuntu runner, so it
  # exercises neither container.
  #
  # This builds both variants the way release.yml does and then IMPORTS them.
  # wickra's equivalent stops at the build; a wheel that compiles is not a wheel
  # that loads, and the musllinux one is the variant nothing else touches.
  python-wheel-container-smoke:
    name: Python wheel (${{ matrix.manylinux }} smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: a container build from a cold cache is slow
    strategy:
      fail-fast: false
      matrix:
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync root README into bindings/python so the build matches release
        run: cp README.md bindings/python/README.md

      # No vendored-TLS dance here, unlike wickra: this binding reaches the
      # network through rustls, so there is no openssl-sys in the graph and the
      # minimal container needs no Perl to build one from source.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}

      # Written to a file rather than passed with -c: the smoke needs both
      # quote characters, and nesting them inside `docker run sh -c '...'`
      # terminates the shell string at the first inner quote.
      - name: Write the wheel smoke script
        shell: bash
        run: |
          cat > wheel-smoke.py <<'PY'
          import json
          import wickra_terminal as wt

          terminal = wt.Terminal(json.dumps({"sources": [{"Synth": {"seed": 1}}]}))
          terminal.command(json.dumps({"type": "Subscribe", "source": 0, "symbol": "BTC/USDT"}))
          frame = terminal.command(json.dumps({"type": "Tick"}))
          assert "panels" in frame, frame
          print("wheel loads and ticks:", len(frame), "bytes")
          PY

      - name: Import the manylinux wheel on the runner
        if: matrix.manylinux == 'auto'
        shell: bash
        # A manylinux wheel is meant to install on any glibc distribution, and
        # the runner is one, so installing it here is the real check.
        run: |
          python -m pip install --no-index --find-links bindings/python/dist --force-reinstall --no-deps wickra-terminal
          python wheel-smoke.py

      - name: Import the musllinux wheel in an Alpine container
        if: matrix.manylinux == 'musllinux_1_2'
        shell: bash
        # musl, so it cannot install on the glibc runner. Alpine is the platform
        # this wheel exists for, and nothing else in CI ever loads it.
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.12-alpine             sh -c "pip install --no-index --find-links bindings/python/dist --force-reinstall --no-deps wickra-terminal && python wheel-smoke.py"

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not ci): the unpublished per-platform optionalDependencies
      # are absent from the lock, and the npm in Node 24 rejects that with
      # EUSAGE. See the longer note in release.yml.
      - name: Install Node dependencies
        # npm's own fetch-retry rides out a single bad request; wrapping the whole
        # install means a longer registry outage retries instead of failing the job.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd bindings/node && npm install --no-audit --no-fund
          shell: bash
      # --platform puts the target triple into the filename so the loader finds
      # the freshly built binary instead of a per-platform npm subpackage.
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      - name: Run Node tests
        run: cd bindings/node && node --test

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - name: Install wasm-pack
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: wasm-pack
      # Two targets, two consumers: `web` is what the Vue renderer imports and
      # what web.yml builds; `nodejs` is the only form `require()` can
      # load, so the test suite needs it. Building both also proves a change
      # has not broken either output shape.
      - name: Build the wasm binding (web target)
        run: wasm-pack build --target web
        working-directory: bindings/wasm
      - name: Build the wasm binding (nodejs target, for the test suite)
        run: wasm-pack build --target nodejs --release --out-dir pkg-node
        working-directory: bindings/wasm
      - name: Verify generated artefacts
        run: |
          test -f bindings/wasm/pkg/wickra_terminal_wasm.js
          test -f bindings/wasm/pkg/wickra_terminal_wasm_bg.wasm
          test -f bindings/wasm/pkg/wickra_terminal_wasm.d.ts
          test -f bindings/wasm/pkg-node/wickra_terminal_wasm.js
      - name: WASM tests (node)
        run: node --test bindings/wasm/tests/*.test.cjs

  web:
    name: Web renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - name: Install wasm-pack
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: wasm-pack
      # The web app depends on the wasm binding's pkg/ via a file: dependency, so
      # build it before installing web dependencies.
      - name: Build the wasm binding (web target)
        run: wasm-pack build --target web
        working-directory: bindings/wasm
      - uses: ./.github/actions/setup-node
        with:
          node-version: "22"
      - name: Install web dependencies
        # npm's own fetch-retry rides out a single bad request; wrapping the whole
        # install means a longer registry outage retries instead of failing the job.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd web && npm ci --no-audit --no-fund
          shell: bash
      - name: Web renderer tests
        run: cd web && npm test
      - name: Build the web renderer
        # vue-tsc first, so a type error fails here rather than at deploy time.
        run: cd web && npm run build

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - name: Install cbindgen
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-terminal-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-terminal-c
      - name: Check the committed header is in sync with cbindgen
        # The generated header is platform-independent, so checking drift on one
        # OS is enough — and avoids a spurious CRLF/LF diff on the Windows runner.
        # The script is the same one contributors run locally, where it skips
        # cleanly if cbindgen is not installed.
        if: runner.os == 'Linux'
        shell: bash
        run: .github/scripts/check-cbindgen.sh
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo

      - name: Build the C ABI library
        run: cargo build -p wickra-terminal-c --release

      - name: Vendored header in sync with the C ABI
        shell: bash
        run: |
          if ! diff -u bindings/c/include/wickra_terminal.h bindings/go/include/wickra_terminal.h; then
            echo "::error::bindings/go/include/wickra_terminal.h is stale — copy bindings/c/include/wickra_terminal.h over it"
            exit 1
          fi

      - name: Stage the native library
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_terminal.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_terminal.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_terminal.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and test the Go binding
        shell: bash
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library next to the test assembly from
      # target/debug (see the <Content> items in the .csproj), so build it in the
      # debug profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-terminal-c
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraTerminal.Tests/WickraTerminal.Tests.csproj -c Release
      # Built here rather than in a separate job because this one already has
      # dotnet and the native library staged on all three runners. macOS is the
      # reason it matters: the example's library copy is per-platform, and a
      # missing entry only shows up as a DllNotFoundException at run time.
      - name: Build and run the C# example
        run: dotnet run --project examples/csharp -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      # The binding loads the C ABI hub via the Java FFM API; the pom points
      # native.lib.dir at target/debug, so build it in the debug profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-terminal-c
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Java info
        run: java -version
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    env:
      WKTERM_INC: ${{ github.workspace }}/bindings/c/include
      WKTERM_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # This job builds the wrapper against the header in the tree, which match
      # by construction. r-universe does not: `bindings/r/configure` downloads
      # the C ABI from the release DESCRIPTION's Version names, so the pairing
      # it compiles is one nothing here ever sees. Checked once rather than per
      # OS -- it reads two files and answers the same on all three.
      - name: Check the R wrapper against the C ABI
        if: runner.os == 'Linux'
        run: python3 scripts/check_r_abi_skew.py
      - uses: ./.github/actions/warm-cargo
      # The package compiles a thin .Call glue layer against the C ABI hub and
      # links -lwickra_terminal from WKTERM_LIB; build the library first.
      - name: Build the C ABI library
        run: cargo build -p wickra-terminal-c --release
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time.
        run: |
          export WKTERM_INC="${WKTERM_INC//\\//}"
          export WKTERM_LIB="${WKTERM_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            export PATH="$(cygpath -u "$WKTERM_LIB"):$PATH"
          else
            export LD_LIBRARY_PATH="$WKTERM_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKTERM_LIB:$DYLD_LIBRARY_PATH"
          fi
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    env:
      # Lifted to job level so the upload step can test for it. A repository
      # without the secret must not report a green coverage job that uploaded
      # nothing.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: ./.github/actions/warm-cargo
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        # Both product crates, not just the core: ui-tui is a thousand lines of
        # renderer with its own tests, and measuring only wickra-terminal-core reported a
        # number for a third of the code while the rest went unseen. wickra-terminal-bench
        # stays out — benches are not product code, and neither sibling repo
        # measures its bench crate.
        #
        # This used to pass `--no-default-features`, with a comment claiming it
        # dropped the `live` feature. It did not. `wickra-terminal` depends on
        # `wickra-terminal-core` with default features, and feature unification turns
        # `live` straight back on:
        #
        #   cargo tree --no-default-features -e features -i wickra-terminal-core
        #     wickra-terminal-core feature "default" <- wickra-terminal
        #     wickra-terminal-core feature "live"    <- wickra-terminal-core feature "default"
        #
        # So the flag did nothing except describe a state that never held, and it
        # could not be made to work without dropping ui-tui from the measurement,
        # which the paragraph above explains is exactly the wrong trade.
        #
        # `source/live.rs` is therefore measured, and reports as a hole: it is the
        # real-socket path, which the offline suite cannot reach. That number is
        # honest rather than flattering, and wickra closed the same hole by
        # building a mock-WebSocket suite for its live path and then deliberately
        # ENABLING the feature in coverage.
        #
        # This paragraph used to end "that is the way to close this one too",
        # which read as though live.rs were the thing to do next. It was not:
        # when the report was first read against it, live.rs was the FIFTH
        # largest hole, behind the generated registry and several renderer
        # widgets that no test drew at all. No ranking is given here now, because
        # that is exactly what went stale -- ask Codecov which files miss the
        # most before starting, and work from the answer rather than from a
        # comment.
        run: >
          cargo llvm-cov
          -p wickra-terminal-core -p wickra-terminal
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true

      - name: Report a missing Codecov token
        if: env.CODECOV_TOKEN == ''
        run: >
          echo "::warning::CODECOV_TOKEN is not set for this repository, so the
          coverage report was generated but never uploaded. The README badge and
          the codecov/patch status stay empty until the secret is added."

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          # cargo-fuzz needs neither, but the fmt and clippy gates below do, and
          # dtolnay/rust-toolchain installs no components unless asked.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
        with:
          workspaces: fuzz
      - uses: ./.github/actions/warm-cargo
        with:
          working-directory: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-fuzz
      # `fuzz` is `workspace.exclude`d, so `cargo fmt --all` and
      # `cargo clippy --workspace` never reach it and its four targets were
      # ungated entirely. The nightly toolchain and the cache are already here
      # for cargo-fuzz, so gating costs seconds.
      #
      # These run on nightly because that is what this job has, which means a
      # nightly lint change can break them where a stable one would not. The
      # targets are four small files that rarely change, so the trade is worth
      # it; if a nightly churns, the fix is one line here.
      - name: Fuzz targets, formatting
        run: cargo +nightly fmt --check
        working-directory: fuzz

      - name: Fuzz targets, clippy
        run: cargo +nightly clippy --all-targets -- -D warnings
        working-directory: fuzz

      - name: Fuzz feed_event (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu feed_event -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz state_fold (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu state_fold -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz view_model (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu view_model -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz config_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu config_parse -- -max_total_time=30
        working-directory: fuzz

  # Early heads-up on link rot while reviewing a PR. Non-blocking on purpose:
  # external link failure is non-deterministic (third-party sites go down,
  # rate-limit or move), and a transient outage must never gate a merge. The
  # authoritative run is links.yml on a weekly schedule.
  links:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Keep this file set in step with links.yml.
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "docs/*.md" "bindings/*/README.md" "bindings/csharp/WickraTerminal/README.md" "examples/README.md" "golden/README.md" "web/README.md"
          fail: true

  # Syntax-only, and deliberately so: it needs no native library, so it stays a
  # fast guard against the common breakage (a bad edit to an example nobody
  # runs). It does NOT prove an example works -- the C example is built and run
  # by the c-abi job, the C# one by the csharp job, and the Rust one is a
  # workspace member, so `cargo build --workspace` compiles it.
  examples-smoke:
    name: Examples (syntax smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a parse check; if it is not done in fifteen minutes it is stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Node examples, syntax check
        shell: bash
        run: |
          shopt -s nullglob
          count=0
          for f in examples/node/*.js; do
            echo "node --check $f"
            node --check "$f"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::no Node examples found to check"; exit 1; }
          echo "checked $count Node .js files"

      - name: Python examples, byte-compile
        shell: bash
        run: |
          shopt -s nullglob
          count=0
          for f in examples/python/*.py; do
            echo "py_compile $f"
            python -m py_compile "$f"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::no Python examples found to check"; exit 1; }
          echo "compiled $count Python files"

      - name: Java examples, compile
        shell: bash
        # Compiled rather than parsed: javac has no parse-only mode, and the
        # binding sources on the sourcepath are enough to resolve the example
        # without Maven or the native library. --release 22 matches the POM and
        # is the version that finalised the FFM API this binding uses.
        run: |
          shopt -s nullglob
          files=(examples/java/*.java)
          test "${#files[@]}" -gt 0 || { echo "::error::no Java examples found to check"; exit 1; }
          mkdir -p /tmp/java-examples
          javac --release 22 -d /tmp/java-examples             -sourcepath bindings/java/src/main/java "${files[@]}"
          echo "compiled ${#files[@]} Java files"

      - name: R examples, parse check
        shell: bash
        # parse() reads and rejects, without sourcing, so this needs neither the
        # installed package nor the native library the example loads at run time.
        run: |
          shopt -s nullglob
          count=0
          for f in examples/r/*.R; do
            echo "parse $f"
            Rscript -e 'invisible(parse(commandArgs(trailingOnly = TRUE)[1]))' "$f"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::no R examples found to check"; exit 1; }
          echo "checked $count R files"

      - name: Go examples, parse check
        shell: bash
        # gofmt parses without building, so this needs neither cgo nor the native
        # library the Go example links against at run time.
        run: |
          shopt -s nullglob
          count=0
          for f in examples/go/*.go; do
            echo "gofmt -e $f"
            gofmt -e "$f" > /dev/null
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "::error::no Go examples found to check"; exit 1; }
          echo "checked $count Go files"
