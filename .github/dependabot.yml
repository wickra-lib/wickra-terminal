version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # The fuzz targets are their own cargo workspace -- fuzz/Cargo.toml carries an
  # empty [workspace] table so cargo-fuzz can build them on nightly with
  # sanitizer flags -- so the cargo entry above does not reach fuzz/Cargo.lock.
  # It pins libfuzzer-sys and serde_json, which received no updates at all while
  # nothing watched them.
  #
  # No `ignore` list here even though a second cargo entry does not inherit the
  # root one: the root entry has none. If it ever grows one, this entry needs the
  # same lines, because the first thing an unguarded side entry proposes is
  # exactly what the root entry blocks.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo-fuzz)"
    groups:
      cargo-fuzz:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # The Node example has its own package.json + package-lock.json, so it needs
  # its own entry — a lock file nothing watches is a lock file that rots.
  - package-ecosystem: npm
    directory: "/examples/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-example:
        patterns: ["*"]

  # The Go example carries its own go.mod, separate from the binding's.
  - package-ecosystem: gomod
    directory: "/examples/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-example:
        patterns: ["*"]

  # Web renderer (Vue/Vite) npm dependencies.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(web)"
    groups:
      web:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # Hash-pinned CI Python tooling under .github/requirements/. Each <name>.in
  # is the loose source; the matching hash-locked <name>.txt is generated by
  # scripts/update-lockfiles.sh with uv.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    # Version-update PRs disabled (0), and not as a convenience: uv compiles
    # each lock against a target interpreter via --python-version, and
    # Dependabot edits the .txt directly without honouring that. On the wickra
    # library every such PR broke the 3.9 rows -- dropped `==` pins, pulled a
    # pytest that needs 3.10. The split here has the same shape, so it would
    # break the same way. Refresh with the script instead. Security updates
    # are not affected by this limit.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-pip)"
    groups:
      ci-pip:
        patterns: ["*"]
  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.86 for the
    # MSRV job, 1.88 for the Node binding), not an action version. Dependabot
    # misreads the channel as a version and proposes non-existent Rust releases
    # (e.g. 1.100). The toolchain pins are managed manually with the MSRV policy.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding (Maven) — tracks the C-ABI binding's build/publishing plugins.
  - package-ecosystem: maven
    directory: "/bindings/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published WickraTerminal.csproj is a thin C-ABI
  # wrapper with no external packages; the test project pulls xunit and
  # Microsoft.NET.Test.Sdk.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/WickraTerminal.Tests"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Go binding (Go modules). The binding's own go.mod has no external deps but
  # Dependabot keeps the toolchain/directive current.
  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]
