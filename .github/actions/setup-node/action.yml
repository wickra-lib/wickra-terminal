name: Setup Node (with retry)
description: >
  Install Node via actions/setup-node, retrying once after a short pause. The
  Windows runners intermittently stall downloading the toolchain from the CDN
  ("Attempting to download 20..." and then nothing until the job times out),
  which setup-node does not retry on its own. Same shape as setup-rust.

inputs:
  node-version:
    description: Node version to install.
    required: true
  cache:
    description: 'Package manager whose cache to restore ("npm"), or empty for none.'
    required: false
    default: ""
  cache-dependency-path:
    description: Lockfile the cache key is derived from.
    required: false
    default: ""
  registry-url:
    description: Registry to authenticate against, for publishing steps.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: first
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}

    - name: Wait before retrying the Node install
      if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::setup-node failed (likely a CDN flake); retrying in 30s"
        sleep 30

    - name: Retry the Node install
      if: steps.first.outcome == 'failure'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}
