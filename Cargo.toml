# Wickra Terminal — workspace.
# A streaming trading terminal built as one data-driven core (`wickra-terminal-core`)
# with two reference renderers: a native TUI (ratatui) and a Web front-end
# (WASM + Vue). The core is exposed as a JSON-over-C-ABI data API in ten
# languages, mirroring the Wickra tiering: Rust core -> native Python/Node/WASM
# + a C ABI hub for C/C++/C#/Go/Java/R. Panels emit view-models (never renderer
# commands), so one core logic drives every front-end.

[workspace]
resolver = "2"
members = [
    "crates/wickra-terminal-core",
    "crates/ui-tui",
    "crates/terminal-bench",
    "bindings/c",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
    "examples/rust",
]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on its
# own with sanitizer flags on a nightly toolchain.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["kingchenc"]
repository = "https://github.com/wickra-lib/wickra-terminal"
homepage = "https://terminal.wickra.org"
readme = "README.md"
keywords = ["trading", "terminal", "tui", "streaming", "charts"]
categories = ["visualization", "finance", "command-line-utilities"]

[workspace.dependencies]
# Wickra ecosystem. wickra-core ships on crates.io; the exchange is consumed
# from git until its first crates.io release (its tag is USER-GO gated), which
# lets the terminal build against the real crate in CI.
wickra-core = "1"
# A `version` is pinned alongside `git` so the dependency is not a wildcard
# (cargo-deny's `bans.wildcards = deny`); cargo checks it against the repo's
# crate version. An explicit `rev` pins the tree as well, so `cargo update`
# cannot silently move an unreleased dependency out from under a green CI run.
# Move these to plain crates.io versions after the exchange release.
# `wickra-exchange-core` carries the market types (Symbol/Event/…) with no
# networking, so it compiles on wasm32; the `wickra-exchange` facade adds the
# native connectivity (tokio/reqwest) used only by the `live` feature.
wickra-exchange-core = { git = "https://github.com/wickra-lib/wickra-exchange", rev = "330df9127829e0caaab4d097d8ce6e659586aa71", version = "0.1" }
wickra-exchange = { git = "https://github.com/wickra-lib/wickra-exchange", rev = "330df9127829e0caaab4d097d8ce6e659586aa71", version = "0.1" }
wickra-terminal-core = { version = "0.1.0", path = "crates/wickra-terminal-core" }
# Serialization — the data-driven boundary (config/command/view-models as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML config parsing (the on-disk `--config` form).
toml = "1.1"
# Exact decimal arithmetic for price/qty (never f64 in the market layer).
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
thiserror = "2"
# TUI renderer.
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
# WASM renderer bridge.
wasm-bindgen = "0.2"
# Test/dev.
criterion = "0.8"
proptest = "1"

[workspace.lints.rust]
# `forbid`, not `deny`: nothing outside the C ABI boundary has any business
# reaching for unsafe, and forbid cannot be switched off by an `#[allow]` that
# slips in with a future change. The two crates that genuinely need it say so in
# their own manifests, which is visible in review rather than buried in a file.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (same precedent as the wickra core).
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"

[profile.release]
opt-level = 3
# Fat LTO across the whole graph and a single codegen unit. This is a streaming
# core whose hot path is one indicator update per tick, so cross-crate inlining
# is where the throughput is; the published TUI binaries and all four cdylibs
# were shipping with the defaults (`lto = false`, 16 codegen units) until now.
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort. Half of the old reasoning here was right -- unwinding out of
# an `extern "C"` function is undefined behaviour -- but abort is the wrong answer
# to it, because the fix is to catch the panic before it reaches the boundary, and
# aborting is what stops that from being possible.
#
# The bindings are workspace members, and Cargo refuses `panic` in a per-package
# profile override ("`panic` may not be specified in a `package` profile"), so
# whatever is set here is what the Python, Node, WASM and C ABI cdylibs are built
# with. Under `abort` no boundary can catch anything: a panic in the core kills
# the host process -- the Python interpreter, the Node process, the C caller --
# instead of surfacing as an error the caller can handle.
#
# What each boundary actually does with the unwinding, which is not uniform and
# was described here as though it were:
#
#   C ABI  `bindings/c/src/lib.rs` wraps every entry point in `catch_unwind` and
#          returns a null handle or `WICKRA_TERMINAL_ERR`.
#   Python pyo3 catches unconditionally in its own trampolines and raises
#          `PanicException`; the binding does nothing to earn it.
#   Node   napi-rs does NOT. Its codegen emits the wrapper only where
#          `#[napi(catch_unwind)]` asks for it, so the attribute is on both
#          fallible entry points and a test in that crate keeps it there.
#          Without it, a core panic exits the Node process with 127.
#   WASM   not covered, and not fixable this way: unwinding on
#          wasm32-unknown-unknown traps and poisons the instance, so the panic
#          reaches JavaScript as a `RuntimeError` and the module has to be
#          rebuilt rather than resumed.
#
# The old setting was invisible in CI as well: `cargo test -p wickra-terminal-c`
# uses the test profile, which unwinds, so those guards were exercised in a
# configuration that was never shipped.
panic = "unwind"

# Benchmarks must be built the way the shipped artefact is, or the numbers
# describe a binary nobody runs.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
# `strip` is the one release setting deliberately NOT inherited. It changes
# nothing about the code, only what is left to read it by: on ELF and Mach-O
# targets `strip = true` removes the symbol table as well as debug info, so a
# criterion binary had no function names and a profiler could only attribute
# samples to addresses. The benchmarks could be run but not investigated, and
# `bench.yml` runs them on ubuntu-latest, which is exactly such a target.
#
# It makes no difference on Windows, where symbols live in a separate PDB and
# `debug = false` means there is none to begin with -- measured, the two binaries
# carry the same names either way.
#
# `debug` stays false, so the codegen still matches the shipped artefact and the
# attribution is per function rather than per line. Line-level would mean
# shipping debug info into the benchmark, which is a different trade.
strip = false

[profile.dev]
opt-level = 0
debug = true
