[package]
name = "wickra-terminal-wasm"
description = "WebAssembly bindings for wickra-terminal — the data-driven core in the browser, feeding the web renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# The core without the `live` feature: no native networking, so it compiles to
# wasm32 (the browser feeds Live over its own WebSocket, not the native client).
# Declared as a direct path dep, not `workspace = true`, because cargo silently
# ignores `default-features = false` on an inherited workspace dependency.
wickra-terminal-core = { path = "../../crates/wickra-terminal-core", version = "0.1.1", default-features = false }
wasm-bindgen = { workspace = true }

# `wickra-exchange-core` (a transitive dependency via the terminal core, for the
# market types) pulls `p256`/`getrandom`; getrandom needs its `js` backend to
# compile for the browser. This applies only to wasm32 builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.3/0.4 also enter the tree transitively; enable their `wasm_js`
# backend feature (selected via .cargo/config.toml's getrandom_backend cfg).
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_v4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = false

[package.metadata.wasm-pack.profile.release]
# The wasm-opt that ships with wasm-pack is older than the WebAssembly features
# rustc enables by default (reference-types, multivalue, bulk-memory,
# sign-extension, mutable-globals, ...). Listing them all keeps wasm-opt happy
# without requiring a binaryen upgrade in CI.
#
# This became load-bearing when the workspace release profile gained
# `lto = "fat"` and a single codegen unit: with the whole graph visible, LLVM
# lowers memcpy to `memory.copy` instead of a shim, and the bundled wasm-opt
# rejected it with "Bulk memory operations require bulk memory". The build was
# green before only because the optimiser never emitted those instructions.
wasm-opt = [
    '-O3',
    '--enable-bulk-memory',
    '--enable-mutable-globals',
    '--enable-nontrapping-float-to-int',
    '--enable-sign-ext',
    '--enable-reference-types',
    '--enable-multivalue',
]
