[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "wickra-terminal"
version = "0.1.0"
description = "The data-driven trading-terminal core: build a Terminal from a JSON config, drive it with commands, read back frame view-models."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "kingchenc", email = "support@wickra.org" }]
requires-python = ">=3.9"
keywords = ["trading", "terminal", "tui", "streaming", "charts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
# Floors, not pins, since this is a published extra rather than a CI lockfile --
# but floors that exclude the versions carrying PYSEC-2026-1845. `pytest>=7`
# admitted every vulnerable release, which is what a scanner reads off the
# published metadata. 3.9 has no patched pytest (the fix lands in 9.0.3, which
# needs >= 3.10, and 8.x has no backport), so it floors at the newest release
# that runs there.
test = [
    "pytest>=8.4.2; python_version < '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/wickra-lib/wickra-terminal"
Repository = "https://github.com/wickra-lib/wickra-terminal"
Documentation = "https://terminal.wickra.org"
Issues = "https://github.com/wickra-lib/wickra-terminal/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "wickra_terminal._wickra_terminal"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# A DeprecationWarning out of pyo3 or CPython is a signal that this binding is
# about to break on the next version; it must fail the suite, not scroll past.
filterwarnings = ["error"]
