[package]
name = "wickra-terminal-c"
description = "C ABI (cdylib + staticlib) for wickra-terminal — the hub every C-capable language (C, C++, C#, Go, Java, R) links against."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "wickra_terminal"
crate-type = ["cdylib", "staticlib"]

# The C ABI inherently needs `unsafe` (raw pointers across the FFI boundary), so
# this crate cannot inherit the workspace's `unsafe_code = "forbid"`. Cargo has
# no partial override -- a crate either takes the workspace set or replaces it --
# so the rest of the set is repeated verbatim rather than silently dropped.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"

[dependencies]
terminal-core = { workspace = true }
