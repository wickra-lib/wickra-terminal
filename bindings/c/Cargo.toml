[package]
name = "wickra-terminal-c"
description = "C ABI (cdylib + staticlib) for wickra-terminal — the hub every C-capable language (C, C++, C#, Go, Java, R) links against."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "wickra_terminal"
crate-type = ["cdylib", "staticlib"]

# The C ABI inherently needs `unsafe` (raw pointers across the FFI boundary).
# The lint set is inherited; the two relaxations this boundary needs are scoped
# to the crate in src/lib.rs, where the reason for each is written down.
[lints]
workspace = true

[dependencies]
terminal-core = { workspace = true }
