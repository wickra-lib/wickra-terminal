[package]
name = "wickra-terminal-node"
description = "Node.js bindings for wickra-terminal: the data-driven trading-terminal core."
version.workspace = true
authors.workspace = true
edition.workspace = true
# napi-build requires Rust >= 1.88 (newer than the workspace 1.86 minimum).
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# napi-derive emits its own guarded unsafe, and the workspace does not forbid
# unsafe, so this crate needs no relaxation of its own.
# napi's derive macros expand to `unsafe` inside this crate, so it cannot inherit
# the workspace's `forbid`. `deny` rather than `allow`: hand-written unsafe still
# has to justify itself with an explicit `#[allow]`, which `forbid` would make
# impossible and `allow` would make invisible.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"

[dependencies]
terminal-core = { workspace = true }
napi = { version = "3.9", features = ["napi8"] }
napi-derive = "3.5"

[build-dependencies]
napi-build = "2"
