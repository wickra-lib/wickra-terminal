[package]
name = "wickra-terminal"
description = "The native TUI renderer for the Wickra trading terminal (ratatui)."
version.workspace = true
edition.workspace = true
# ratatui pulls `instability`/`darling`, which require Rust 1.88 (newer than the
# workspace 1.86 minimum). Left version-free on purpose: the constraint follows
# ratatui, not one release of it. The library (wickra-terminal-core) stays 1.86; this
# TUI application needs 1.88, and is checked by the 1.88 MSRV job.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not docs.rs: this crate is bin-only, so docs.rs would build an empty page.
documentation = "https://terminal.wickra.org"
keywords.workspace = true
categories.workspace = true

# docs.rs builds every published crate, bin-only ones included, and it renders
# default features unless told otherwise. This crate has no features today, so
# the block changes nothing about the page -- it is here so the setting is
# uniform across everything this workspace publishes, and so a feature added
# later is documented from the first release that carries it rather than from
# whichever one somebody notices.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[bin]]
# `wkterm`, not `wickra-terminal`, and the reason is an output collision rather
# than brevity. Cargo normalises a target name to an object-file stem, so a bin
# called `wickra-terminal` and the C ABI's `wickra_terminal` cdylib both write
# `wickra_terminal.pdb`; a parallel `cargo build --workspace` on Windows races
# for it and fails with LNK1201. Cargo warns about the collision itself.
#
# The bin is what moves because the cdylib name is what every binding dlopens.
# wickra-backtest reached the same place from the same constraint and named its
# CLI `wkbt`; the R binding here already prefixes everything `wkterm_`.
#
# The package is still `wickra-terminal`, so `cargo install wickra-terminal` is
# unchanged -- it just puts `wkterm` on the PATH.
name = "wkterm"
path = "src/main.rs"

[dependencies]
wickra-terminal-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
